<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="820" height="380" fill="url(#bg)"/>
  <text x="410" y="40" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Cover Identity Generator — Architecture</text>

  <!-- Faker -->
  <rect x="30" y="120" width="180" height="100" rx="10" fill="url(#box)" stroke="#f0883e" stroke-width="2"/>
  <text x="120" y="150" fill="#f0883e" font-size="14" font-weight="700" text-anchor="middle">Faker (locale)</text>
  <text x="120" y="172" fill="#8b949e" font-size="12" text-anchor="middle">names · dates · addresses</text>
  <text x="120" y="190" fill="#8b949e" font-size="12" text-anchor="middle">phones · companies</text>

  <!-- Engine -->
  <rect x="300" y="90" width="220" height="160" rx="10" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
  <text x="410" y="120" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">consistency engine</text>
  <text x="410" y="144" fill="#8b949e" font-size="12" text-anchor="middle">age ⇄ date of birth</text>
  <text x="410" y="162" fill="#8b949e" font-size="12" text-anchor="middle">email ⇄ name</text>
  <text x="410" y="180" fill="#8b949e" font-size="12" text-anchor="middle">backstory ⇄ dates</text>
  <text x="410" y="198" fill="#8b949e" font-size="12" text-anchor="middle">anchors + seed</text>

  <!-- Output -->
  <rect x="610" y="120" width="180" height="100" rx="10" fill="url(#box)" stroke="#3fb950" stroke-width="2"/>
  <text x="700" y="150" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">legend</text>
  <text x="700" y="172" fill="#8b949e" font-size="12" text-anchor="middle">plain · json · markdown</text>
  <text x="700" y="190" fill="#8b949e" font-size="12" text-anchor="middle">+ memorize drill</text>

  <!-- Arrows -->
  <path d="M 210 170 L 300 160" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 520 160 L 610 160" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <text x="410" y="330" fill="#8b949e" font-size="11" text-anchor="middle">Same seed → same identity. Fictional legends for stories and games.</text>
</svg>
